name: Studio Next stable lock refresh (temporary feature-branch only)
on:
  pull_request:
    branches: [commerce-rebuild-2026-10]
    paths:
      - commerce-platform/control-plane/package.json
      - .github/workflows/studio-next-lock.yml
permissions: { contents: write }
jobs:
  pinned-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/visual-builder-recovery-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-recovery-20261029
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Generate feature-only frozen lockfile
        working-directory: commerce-platform/control-plane
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          grep -q "15.5.28" pnpm-lock.yaml
      - name: Commit isolated next lock
        run: |
          set -euo pipefail
          git add commerce-platform/control-plane/pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(studio): pin Next.js security-patched 15.5.28 lock"
          git push origin HEAD:feature/visual-builder-recovery-20261029
