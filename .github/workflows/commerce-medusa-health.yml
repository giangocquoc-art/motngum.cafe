name: Commerce Medusa Integration Health
on:
  push:
    branches: [commerce-rebuild-2026-10]
    paths: [commerce-platform/medusa-health.trigger]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  medusa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: medusa_ci }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d medusa_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_ci
      REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: ci-ephemeral-only-not-for-production-jwt-20261029
      COOKIE_SECRET: ci-ephemeral-only-not-for-production-cookie-20261029
      MEDUSA_DISABLE_TELEMETRY: "true"
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commerce-rebuild-2026-10
          sparse-checkout: commerce-platform/commerce
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm --version
      - name: Install imported OSS with frozen lockfile
        working-directory: commerce-platform/commerce
        run: pnpm install --frozen-lockfile
      - name: Build Medusa backend from imported source
        working-directory: commerce-platform/commerce
        run: pnpm --filter @dtc/backend build
      - name: Apply Medusa migrations (real PostgreSQL)
        working-directory: commerce-platform/commerce/apps/backend
        run: pnpm medusa db:migrate
      - name: Bootstrap Vietnam region with official Medusa workflows
        working-directory: commerce-platform/commerce/apps/backend
        run: pnpm medusa exec ./src/scripts/seed-vietnam.ts
      - name: Start API and assert health
        working-directory: commerce-platform/commerce/apps/backend
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm start >/tmp/motngum-medusa.log 2>&1 &
          echo $! >/tmp/motngum-medusa.pid
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS --connect-timeout 2 http://127.0.0.1:9000/health >/tmp/medusa-health; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then tail -120 /tmp/motngum-medusa.log; exit 1; fi
          grep -qi "ok" /tmp/medusa-health || { cat /tmp/medusa-health; exit 1; }
          cat /tmp/medusa-health
          echo "PASS: imported Medusa backend built, migrated and served health on PostgreSQL + Redis."
      - name: Save logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: medusa-health-failure-logs
          path: /tmp/motngum-medusa.log
          if-no-files-found: ignore
