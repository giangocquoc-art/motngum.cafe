name: Commerce Control Plane Security and Build
on:
  push:
    branches: [commerce-rebuild-2026-10]
    paths:
      - "commerce-platform/control-plane/**"
      - "commerce-platform/packages/tenant-contract/**"
      - "commerce-platform/edge/**"
      - "commerce-platform/scripts/**"
      - "commerce-platform/control-plane.trigger"
      - ".github/workflows/commerce-saas-ci.yml"
  pull_request:
    branches: [commerce-rebuild-2026-10]
    paths:
      - "commerce-platform/control-plane/**"
      - "commerce-platform/packages/tenant-contract/**"
      - "commerce-platform/edge/**"
      - ".github/workflows/commerce-saas-ci.yml"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: commerce-saas-gate-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: commerce_ci
          POSTGRES_PASSWORD: commerce_ci_only
          POSTGRES_DB: commerce_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U commerce_ci -d commerce_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgres://commerce_ci:commerce_ci_only@127.0.0.1:5432/commerce_ci
      AUTH_SECRET: ci-only-auth-secret-generated-for-disposable-testing-not-production
      ENABLE_PUBLIC_SIGNUP: "false"
      ENABLE_PREVIEW_SIGNUP: "false"
      ENABLE_PLATFORM_BILLING: "false"
      BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the actual PR/branch revision; never test an unrelated hard-coded ref.
          sparse-checkout: |
            commerce-platform/control-plane
            commerce-platform/edge
            commerce-platform/scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Install source package from lockfile
        working-directory: commerce-platform/control-plane
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: commerce-platform/control-plane
        run: pnpm exec tsc --noEmit
      - name: Production cutover gate must fail closed without evidence
        run: node commerce-platform/scripts/apex-release-gate.mjs --self-test
      - name: Edge D1 authorization and idempotent provisioning contract tests
        run: node --test commerce-platform/edge/test/merchant-provisioning.test.mjs
      - name: Drizzle migrate disposable PostgreSQL
        working-directory: commerce-platform/control-plane
        run: pnpm db:migrate
      - name: Build Next.js with billing off and no fake Stripe credentials
        working-directory: commerce-platform/control-plane
        run: pnpm build
      - name: Secure route smoke tests
        working-directory: commerce-platform/control-plane
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm start >/tmp/commerce-saas.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/sign-in >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/sign-in >/dev/null
          check_code() {
            path="$1"; wanted="$2"; method="${3:-GET}"
            code="$(curl -sS -X "$method" -o /tmp/response.json -w '%{http_code}' "http://127.0.0.1:3000$path")"
            test "$code" = "$wanted" || { echo "Unexpected $path status: $code"; cat /tmp/response.json; exit 1; }
          }
          check_code /builder-demo 200
          check_code /api/sites 401
          check_code /s/never-published 404
          check_code /api/user 401
          check_code /api/team 401
          check_code /api/stripe/checkout 404
          check_code /api/stripe/webhook 404 POST
          check_code /api/health 200
          jq -e '.infrastructureOk == true and .postgres == "connected" and .edge == "connected" and .commerceReady == false' /tmp/response.json
          # This endpoint remains protected by a secret; a request without the
          # secret must NEVER provision merchants, even if the Worker has been updated.
          cf_health="$(curl -sS -o /tmp/cf-health.json -w '%{http_code}' https://commerce-preview.motngum.cafe/health)"
          test "$cf_health" = 200
          jq -e '.ok == true and .commerceReady == false' /tmp/cf-health.json
          cf_provision="$(curl -sS -X POST -H 'Content-Type: application/json' \
            --data '{"id":"d46d8ebc-3b48-4f48-bb3c-8e5f3c870a7b","slug":"must-not-provision","display_name":"Must Not Provision"}' \
            -o /tmp/cf-provision.json -w '%{http_code}' \
            https://commerce-preview.motngum.cafe/internal/merchants)"
          test "$cf_provision" = 401 -o "$cf_provision" = 503
          cf_status="$(curl -sS -o /tmp/cf-status.json -w '%{http_code}' https://commerce-preview.motngum.cafe/api/status)"
          test "$cf_status" = 200
          jq -e '.merchantCount == 0 and .productionReady == false' /tmp/cf-status.json
          echo "PASS: auth endpoint private, Stripe endpoints disabled, Next.js live."
      - name: Verify real signed-cookie JWT revocation, scoped membership and PostgreSQL unique index
        working-directory: commerce-platform/control-plane
        run: node test/auth-db-session.mjs
      - name: Builder two-tenant site lifecycle E2E
        working-directory: commerce-platform/control-plane
        run: node test/builder-site-e2e.mjs
      - name: Real Chromium studio interactions (no Vercel)
        working-directory: commerce-platform/control-plane
        timeout-minutes: 8
        env:
          PLAYWRIGHT_MODULE: file:///tmp/motngum-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          npm install --prefix /tmp/motngum-browser --no-save --no-audit --no-fund playwright@1.56.1
          node /tmp/motngum-browser/node_modules/playwright/cli.js install --with-deps chromium
          node test/browser-builder.mjs
      - name: Block unsafe default demo seed
        run: |
          set -euo pipefail
          ! grep -F 'admin123' commerce-platform/control-plane/lib/db/seed.ts
          ! grep -F 'test@test.com' commerce-platform/control-plane/lib/db/seed.ts
          ! grep -F 'stripe.products.create' commerce-platform/control-plane/lib/db/seed.ts
          echo "PASS: no default seed or auto-created paid products."
      - name: Build logs if failed
        if: failure()
        run: tail -120 /tmp/commerce-saas.log || true
