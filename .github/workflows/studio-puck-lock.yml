name: Studio Puck pinned lockfile (feature branch only)
on:
  pull_request:
    branches: [commerce-rebuild-2026-10]
    paths:
      - "commerce-platform/control-plane/package.json"
      - ".github/workflows/studio-puck-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-pinned-lock:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/visual-builder-recovery-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-builder-recovery-20261029
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Regenerate only the feature-branch pnpm lockfile
        working-directory: commerce-platform/control-plane
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          grep -q "'@puckeditor/core':" pnpm-lock.yaml
      - name: Commit lockfile back to the SAME feature branch
        run: |
          set -euo pipefail
          git add commerce-platform/control-plane/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(studio): pin Puck 0.24.0 transitive dependency graph"
          git push origin HEAD:feature/visual-builder-recovery-20261029
