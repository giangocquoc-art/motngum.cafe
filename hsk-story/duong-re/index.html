<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#f8f1df"><title>Chuyện của An · Chim Sẻ</title><link rel="icon" href="/art/brand/flat-favicon.svg"><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/scene-layers.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="./style.css"></head>
<body><main class="branch-shell" id="branchShell">
<header class="branch-header"><a href="/" aria-label="Về trang Chim Sẻ"><img src="/art/brand/flat-sparrow.svg" alt=""><b>Chim Sẻ</b></a><span id="dayLabel">Chuyện của An</span><button id="journalToggle" type="button" aria-haspopup="dialog">☷ Sổ tay</button></header>
<section class="branch-stage" id="stage" aria-label="Khung cảnh của câu chuyện"><div id="branchArt" aria-hidden="true"></div><span class="place-label" id="placeLabel"></span><button id="sparrowBtn" type="button">Sẻ nói nhỏ</button></section>
<section class="branch-reader" aria-label="Câu chuyện và lời của An"><div class="reader-heading"><span id="speaker"></span><span id="pageLabel"></span></div><h1 id="sceneTitle" tabindex="-1"></h1><div id="content" class="reader-content" aria-live="polite"></div><p id="inputMessage" role="status" class="input-message"></p><nav class="reader-nav" aria-label="Điều khiển câu chuyện"><button id="previousBtn" type="button">← Trước</button><button id="nextBtn" type="button" class="primary">Đọc tiếp ↗</button></nav></section></main>
<dialog id="journalPanel" aria-labelledby="journalTitle"><div class="dialog-head"><h2 id="journalTitle">Sổ tay của An</h2><button id="closeJournal" type="button" aria-label="Đóng sổ tay">✕</button></div><div id="journalContent" class="journal-content"></div><div class="dialog-nav"><button id="journalPrev" type="button">← Trước</button><span id="journalPage"></span><button id="journalNext" type="button">Tiếp →</button></div></dialog>
<dialog id="sparrowPanel" aria-labelledby="sparrowTitle"><div class="dialog-head"><h2 id="sparrowTitle">Sẻ nói nhỏ với An</h2><button id="closeSparrow" type="button" aria-label="Quay lại câu chuyện">✕</button></div><p id="sparrowText"></p></dialog>
<dialog id="helpPanel" aria-labelledby="helpTitle"><div class="dialog-head"><h2 id="helpTitle">Nhắc An một chút</h2><button id="closeHelp" type="button" aria-label="Quay lại lượt nói">✕</button></div><div id="helpContent" class="journal-content"></div></dialog>
<script src="/scene-flat-art.js"></script><script src="/scene-manifest.js"></script><script src="/scene-renderer.js"></script><script src="/content-manifest.js"></script><script src="/curriculum-data.js"></script><script src="/game-core.js"></script><script src="/learning-kit.js"></script><script src="./branch-data.js"></script><script src="./branch-engine.js"></script><script src="./branch-learning.js"></script><script src="./branch-scenes.js"></script><script src="/branch-account.js"></script><script src="/progress-core.js"></script><script src="/account.js"></script><script src="./branch-ui.js"></script></body></html>
